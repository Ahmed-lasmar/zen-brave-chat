services:
  zen-brave-chat:
    image: ahmedtnlasmar/zen-brave-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zen-brave-chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - zen-chat-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - zen-chat-network

volumes:
  zen-chat-data:
    driver: local

networks:
  zen-chat-network:
    driver: bridge
